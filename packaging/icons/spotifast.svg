<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 128 128">
  <title>Motion Music</title>
  <desc>A flowing violet to rose M, drawn as one continuous music wave, inside a dark circular disc with a luminous violet and rose rim.</desc>
  <defs>
    <linearGradient id="disc" x1="16" y1="8" x2="112" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2e1948"/><stop offset=".5" stop-color="#180f28"/><stop offset="1" stop-color="#140c1c"/>
    </linearGradient>
    <radialGradient id="light" cx="24" cy="14" r="107" gradientUnits="userSpaceOnUse">
      <stop stop-color="#aa7cff" stop-opacity=".20"/><stop offset="1" stop-color="#aa7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="22" y1="8" x2="100" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b99ae9" stop-opacity=".44"/><stop offset=".48" stop-color="#7a4b9d" stop-opacity=".12"/><stop offset="1" stop-color="#cf658b" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="wave" x1="28" y1="47" x2="100" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b29bff"/><stop offset=".38" stop-color="#bc7dff"/><stop offset=".72" stop-color="#ed5dc0"/><stop offset="1" stop-color="#ff567d"/>
    </linearGradient>
    <linearGradient id="gleam" x1="32" y1="41" x2="95" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e3d8ff" stop-opacity=".48"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="58" fill="url(#disc)"/>
  <circle cx="64" cy="64" r="58" fill="url(#light)"/>
  <circle cx="64" cy="64" r="57.4" fill="none" stroke="url(#rim)" stroke-width="1.2"/>
  <circle cx="64" cy="64" r="49" fill="none" stroke="#c9a0ff" stroke-opacity=".045"/>
  <path d="M22 26A57 57 0 0 1 101 21" fill="none" stroke="#ddc8ff" stroke-width=".8" stroke-linecap="round" opacity=".18"/>
  <path d="M22 103A57 57 0 0 0 108 99" fill="none" stroke="#f377ba" stroke-width=".9" stroke-linecap="round" opacity=".16"/>
  <path d="M33 85V47Q33 40 38 45L61 67Q64 70 67 66L90 44Q95 39 95 46V85" fill="none" stroke="#b477f6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity=".065"/>
  <path d="M33 85V47Q33 40 38 45L61 67Q64 70 67 66L90 44Q95 39 95 46V85" fill="none" stroke="url(#wave)" stroke-width="13.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28.3 83V47Q28.3 33 40.5 41L62 62" fill="none" stroke="url(#gleam)" stroke-width="1" stroke-linecap="round" opacity=".65"/>
</svg>